# Publicação no merge para a `main` (D23): o build roda uma vez, a mesma pasta `dist` vai na imagem do
# Cloud Run e no Hosting. Login no Google Cloud sem chave (Workload Identity Federation).
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# Um deploy por vez; o seguinte espera o anterior terminar (nunca cancela no meio).
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGION: us-east1
  SERVICE: use-guide
  IMAGE: us-east1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/use-guide/server:${{ github.sha }}
  # Valores públicos do navegador (§2.2 item 2), lidos no build do Vite.
  VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
  VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
  VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
  VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
  VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
  VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
  VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.VITE_FIREBASE_MEASUREMENT_ID }}
  VITE_FIREBASE_FIRESTORE_DATABASE_ID: ${{ vars.VITE_FIREBASE_FIRESTORE_DATABASE_ID }}
  VITE_FIREBASE_RECAPTCHA_SITE_KEY: ${{ vars.VITE_FIREBASE_RECAPTCHA_SITE_KEY }}
  VITE_FIREBASE_VAPID_KEY: ${{ vars.VITE_FIREBASE_VAPID_KEY }}
  VITE_GOOGLE_MAPS_API_KEY: ${{ vars.VITE_GOOGLE_MAPS_API_KEY }}
  VITE_STRIPE_PUBLISHABLE_KEY: ${{ vars.VITE_STRIPE_PUBLISHABLE_KEY }}
  VITE_SUPPORT_WHATSAPP: ${{ vars.VITE_SUPPORT_WHATSAPP }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v3

      - name: Imagem do servidor
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pyyaml

      # Troca só a imagem: variáveis, segredos, conta de serviço e escala continuam como estão no serviço.
      # O `replace` (e não `deploy --image`) tira as anotações de build que o AI Studio deixou no
      # serviço; com elas, o Cloud Run recusa uma imagem pronta (scripts/ops/prepareCloudRunService.py).
      - name: Cloud Run
        run: |
          gcloud run services describe "$SERVICE" --region "$REGION" --project "${{ vars.GCP_PROJECT_ID }}" --format export > service.yaml
          python scripts/ops/prepareCloudRunService.py "$IMAGE" < service.yaml > service.next.yaml
          gcloud run services replace service.next.yaml --region "$REGION" --project "${{ vars.GCP_PROJECT_ID }}" --quiet
          gcloud run services update-traffic "$SERVICE" --to-latest --region "$REGION" --project "${{ vars.GCP_PROJECT_ID }}" --quiet

      # Por último, para o site novo só chamar um servidor que já está no ar.
      - name: Hosting
        run: npx firebase deploy --only hosting --project "${{ vars.GCP_PROJECT_ID }}" --non-interactive
